<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%" fill="none">
  <!-- Subtle ambient decorative glow rings in brand tones -->
  <circle cx="120" cy="94" r="74" fill="#FEE2E2" fill-opacity="0.38" />
  <circle cx="120" cy="94" r="54" fill="#FEE2E2" fill-opacity="0.48" />

  <!-- Subtle balanced welcoming accent sparkles -->
  <path d="M42 48L44.5 53.5L50 56L44.5 58.5L42 64L39.5 58.5L34 56L39.5 53.5Z" fill="#FDA4AF" opacity="0.75" />
  <path d="M200 46L202 50.5L206.5 52.5L202 54.5L200 59L198 54.5L193.5 52.5L198 50.5Z" fill="#FDA4AF" opacity="0.75" />
  <circle cx="206" cy="78" r="2.5" fill="#FECDD3" />
  <circle cx="36" cy="84" r="2.5" fill="#FECDD3" />

  <!-- Floor ground shadows: Grounded, sturdy, natural stance -->
  <ellipse cx="122" cy="155" rx="60" ry="7.5" fill="#CBD5E1" opacity="0.5" />
  <ellipse cx="78" cy="154" rx="28" ry="4.5" fill="#94A3B8" opacity="0.3" />
  <ellipse cx="136" cy="155" rx="36" ry="5.5" fill="#94A3B8" opacity="0.3" />

  <!-- Supporting Object: Fresh / Blank Application Form Document resting angled on the left -->
  <g id="blank-application-form" transform="translate(48, 70) rotate(-5)">
    <!-- Document drop shadow -->
    <rect x="1" y="2" width="48" height="66" rx="6" fill="#94A3B8" opacity="0.25" />
    <!-- Document Card Base (Clean crisp white sheet) -->
    <rect x="0" y="0" width="48" height="66" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    
    <!-- Red Accent Top Header Tab (Siteplan/Pengajuan identifier) -->
    <path d="M0 6C0 2.68629 2.68629 0 6 0H42C45.3137 0 48 2.68629 48 6V11H0V6Z" fill="#B91C1C" />
    
    <!-- Mini House / Siteplan Crest Icon on Document Header -->
    <g transform="translate(8, 17)">
      <path d="M6 1L1 5.5V11C1 11.5 1.5 12 2 12H10C10.5 12 11 11.5 11 11V5.5L6 1Z" fill="#FEE2E2" />
      <path d="M4.5 12V8.5C4.5 8.2 4.7 8 5 8H7C7.3 8 7.5 8.2 7.5 8.5V12" fill="#B91C1C" />
      <!-- Document header title lines -->
      <rect x="15" y="3" width="18" height="2.5" rx="1.25" fill="#64748B" />
      <rect x="15" y="7.5" width="12" height="2" rx="1" fill="#94A3B8" />
    </g>

    <!-- Clean, uncompleted / placeholder field rows (inviting first input) -->
    <rect x="8" y="36" width="32" height="3" rx="1.5" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="0.8" />
    <rect x="8" y="43" width="32" height="3" rx="1.5" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="0.8" />
    <rect x="8" y="50" width="22" height="3" rx="1.5" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="0.8" />
    <rect x="8" y="57" width="16" height="2" rx="1" fill="#E2E8F0" />

    <!-- Prominent "New Submission" Plus Badge overlaid on document lower-right -->
    <g transform="translate(32, 48)">
      <circle cx="8" cy="8" r="9" fill="#FFFFFF" />
      <circle cx="8" cy="8" r="8" fill="#B91C1C" />
      <!-- Crisp White Plus (+) Symbol -->
      <path d="M8 4.5V11.5M4.5 8H11.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
    </g>
  </g>

  <!-- Mascot Character: Warm, Welcoming, Approachable Stance -->
  <!-- Anchored naturally, leaning slightly forward-left toward the user and document -->
  <g id="mascot-welcoming" transform="translate(104, 28)">
    
    <!-- Grounded Sturdy Feet -->
    <!-- Left Leg & Foot -->
    <rect x="12" y="108" width="11" height="17" rx="5" fill="#991B1B" />
    <ellipse cx="17" cy="125" rx="8" ry="4.5" fill="#7F1D1D" />

    <!-- Right Leg & Foot -->
    <rect x="36" y="108" width="11" height="17" rx="5" fill="#991B1B" />
    <ellipse cx="42" cy="125" rx="8" ry="4.5" fill="#7F1D1D" />

    <!-- House Body / Torso (Rounded friendly house structure) -->
    <rect x="6" y="52" width="52" height="62" rx="14" fill="#B91C1C" />

    <!-- Clean white apron / chest patch -->
    <rect x="14" y="68" width="36" height="38" rx="10" fill="#FFFFFF" opacity="0.96" />
    <!-- Mini House crest on chest -->
    <path d="M32 76L24 83V94C24 95 25 96 26 96H38C39 96 40 95 40 94V83L32 76Z" fill="#FEE2E2" />
    <path d="M29 96V89C29 88.5 29.5 88 30 88H34C34.5 88 35 88.5 35 89V96" fill="#B91C1C" />

    <!-- Left Arm: Gently holding & steadying the blank form document -->
    <g transform="translate(-16, 70)">
      <path d="M22 6C14 9 7 17 2 26C0 29 3 32 7 30C12 27 18 21 23 16" stroke="#B91C1C" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Left Hand resting on the top corner of the blank form -->
      <circle cx="3" cy="28" r="5" fill="#991B1B" />
    </g>

    <!-- Head / Roof Bonnet: Iconic SATU RUMAH House Roof -->
    <!-- Chimney on left pitch -->
    <rect x="12" y="14" width="7" height="12" rx="2" fill="#881337" />

    <!-- Triangular roof structure -->
    <path d="M32 10L61 36C64 38.7 62.5 44 58.5 44H5.5C1.5 44 0 38.7 3 36L32 10Z" fill="#881337" />
    <!-- Inner roof highlight rim -->
    <path d="M32 14L6 37.5C4.5 38.8 5.3 41.5 7.3 41.5H56.7C58.7 41.5 59.5 38.8 58 37.5L32 14Z" fill="#991B1B" />

    <!-- Face Area nestled smoothly beneath roof -->
    <rect x="11" y="32" width="42" height="34" rx="10" fill="#FFF1F2" />

    <!-- Friendly, warm, inviting eyes looking directly at the user with gentle happiness -->
    <!-- Left Eye -->
    <g transform="translate(18, 44)">
      <ellipse cx="4" cy="4" rx="3.6" ry="4" fill="#334155" />
      <circle cx="2.5" cy="2.5" r="1.3" fill="#FFFFFF" />
    </g>
    <!-- Right Eye -->
    <g transform="translate(36, 44)">
      <ellipse cx="4" cy="4" rx="3.6" ry="4" fill="#334155" />
      <circle cx="2.5" cy="2.5" r="1.3" fill="#FFFFFF" />
    </g>

    <!-- Encouraging, warm soft eyebrows -->
    <path d="M18 39C21 37.5 25 38 27 40" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" />
    <path d="M37 40C39 38 43 37.5 46 39" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" />

    <!-- Warm, inviting, cheerful smile (approachable & encouraging) -->
    <path d="M27 54.5C28.5 58 35.5 58 37 54.5" stroke="#881337" stroke-width="2.6" stroke-linecap="round" />

    <!-- Rosy cheerful cheeks -->
    <circle cx="15" cy="52" r="3.4" fill="#FDA4AF" opacity="0.7" />
    <circle cx="47" cy="52" r="3.4" fill="#FDA4AF" opacity="0.7" />

    <!-- Right Arm: Extended warmly outward with an open palm gesture inviting the user to start -->
    <g transform="translate(48, 62)">
      <!-- Arm extending naturally outward and slightly upward -->
      <path d="M4 14C12 14 22 10 30 2C32 -0.5 35 2 34 5C30 11 20 18 10 20" stroke="#B91C1C" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
      
      <!-- Welcoming Open Palm / Hand -->
      <!-- Palm Base -->
      <circle cx="33" cy="2" r="5" fill="#B91C1C" />
      <!-- Open fingers gesturing warmly towards the document & user ("Ayo mulai!") -->
      <rect x="33" y="-3" width="4.5" height="7.5" rx="2.25" fill="#991B1B" transform="rotate(20 35 1)" />
      <rect x="36" y="0" width="4" height="6.5" rx="2" fill="#991B1B" transform="rotate(35 38 3)" />
      <rect x="31" y="-5" width="4" height="6" rx="2" fill="#991B1B" transform="rotate(5 33 -2)" />

      <!-- Gentle welcoming gesture motion arcs -->
      <path d="M44 -3C47 1 48 6 46 11" stroke="#FCA5A5" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />
      <path d="M48 2C50.5 5.5 51 9.5 49.5 13.5" stroke="#FCA5A5" stroke-width="1.6" stroke-linecap="round" opacity="0.65" />
    </g>
  </g>
</svg>
